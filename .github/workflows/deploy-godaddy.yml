name: Deploy Frontend to GoDaddy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend/frontend
        run: npm ci

      - name: Build React frontend
        working-directory: Frontend/frontend
        env:
          CI: false
        run: npm run build

      - name: Upload to GoDaddy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.mb4.a3d.mytemp.website
          username: taazamandi@taazamandi.amplemindtechnologies.com
          password: amplemind@123
          protocol: ftps
          local-dir: ./Frontend/frontend/build/
          server-dir: ./
